<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip and Split Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>Tip and Split Calculator</h1>
      <p class="subtitle">COSC 2360 : Project 1</p>
    </header>

    <div class="card-body">
      <!-- Bill amount -->
      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="input-prefix">
          <span>$</span>
          <input type="number" id="bill" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>

      <!-- Tip percentage, with preset buttons your code will generate in Week 3 -->
      <div class="field">
        <label for="tip-percent">Tip percentage</label>
        <div class="input-suffix">
          <input type="number" id="tip-percent" min="0" step="1" placeholder="18" />
          <span>%</span>
        </div>
        <div id="tip-presets" class="presets">
          <!-- Week 3: your code fills this with a button for each preset tip value -->
        </div>
      </div>

      <!-- Number of people -->
      <div class="field">
        <label for="people">Number of people</label>
        <input type="number" id="people" min="1" step="1" placeholder="1" />
      </div>

      <button id="calculate" class="btn">Calculate</button>

      <!-- Validation and error messages go here -->
      <p id="message" class="message" role="status"></p>

      <!-- Results -->
      <section class="results" aria-label="Results">
        <div class="result-row">
          <span class="result-label">Tip</span>
          <span class="result-value" id="tip-amount">$0.00</span>
        </div>
        <div class="result-row">
          <span class="result-label">Total</span>
          <span class="result-value" id="total">$0.00</span>
        </div>
        <div class="result-row total-split">
          <span class="result-label">Per person</span>
          <span class="result-value" id="per-person">$0.00</span>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
